environment: development
environments:
  development:
    backend:
      api_port: 8000
      debug: true
      streamlit_port: 8501
    desktop:
      api_url: http://localhost:8000
      auto_updater: false
    frontend:
      api_url: http://localhost:8000
      port: 3000
    infrastructure:
      minio:
        access_key: minioadmin
        endpoint: localhost:9000
        secret_key: minioadmin
        secure: false
      postgres:
        database: transcription_dev
        host: localhost
        password: postgres
        port: 5432
        username: postgres
      redis:
        db: 0
        host: localhost
        port: 6379
    mobile:
      api_url: http://localhost:8000
      dev_mode: true
    name: development
services:
  fastapi:
    dependencies:
    - postgresql
    - redis
    - minio
    environment_variables: {}
    health_check_url: http://localhost:8000/health
    name: fastapi
    port: 8000
    startup_command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    timeout: 20
    type: backend
  frontend:
    dependencies:
    - fastapi
    environment_variables: {}
    health_check_url: http://localhost:3000
    name: frontend
    port: 3000
    startup_command: npm start
    timeout: 30
    type: frontend
  minio:
    dependencies: []
    environment_variables: {}
    health_check_url: http://localhost:9000/minio/health/ready
    name: minio
    port: 9000
    startup_command: minio server /tmp/minio-data --console-address :9001
    timeout: 15
    type: infrastructure
  postgresql:
    dependencies: []
    environment_variables: {}
    health_check_url: postgresql://localhost:5432
    name: postgresql
    port: 5432
    startup_command: pg_ctl start -D /usr/local/var/postgres
    timeout: 15
    type: infrastructure
  redis:
    dependencies: []
    environment_variables: {}
    health_check_url: redis://localhost:6379
    name: redis
    port: 6379
    startup_command: redis-server
    timeout: 10
    type: infrastructure
  streamlit:
    dependencies:
    - fastapi
    environment_variables: {}
    health_check_url: http://localhost:8501/health
    name: streamlit
    port: 8501
    startup_command: streamlit run app.py --server.port 8501
    timeout: 25
    type: backend
