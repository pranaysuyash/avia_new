<!DOCTYPE html>
<html>
<head>
    <title>Debug Console</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1a1a1a;
            color: #0f0;
        }
        #console {
            background: #000;
            padding: 10px;
            border: 1px solid #0f0;
            min-height: 400px;
            white-space: pre-wrap;
            overflow-y: auto;
        }
        .error { color: #f00; }
        .warn { color: #ff0; }
        .log { color: #0f0; }
    </style>
</head>
<body>
    <h1>Console Output</h1>
    <div id="console"></div>
    <hr>
    <button onclick="location.reload()">Reload</button>
    <button onclick="clearConsole()">Clear</button>
    <hr>
    <iframe id="app" src="/" width="100%" height="300" style="border: 1px solid #333;"></iframe>
    
    <script>
        const consoleDiv = document.getElementById('console');
        let logCount = 0;
        
        function addLog(type, ...args) {
            const msg = args.map(arg => {
                if (typeof arg === 'object') {
                    try {
                        return JSON.stringify(arg, null, 2);
                    } catch(e) {
                        return String(arg);
                    }
                }
                return String(arg);
            }).join(' ');
            
            const line = document.createElement('div');
            line.className = type;
            line.textContent = `[${++logCount}] ${type.toUpperCase()}: ${msg}`;
            consoleDiv.appendChild(line);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }
        
        function clearConsole() {
            consoleDiv.innerHTML = '';
            logCount = 0;
        }
        
        // Override console methods
        const originalConsole = {
            log: console.log,
            error: console.error,
            warn: console.warn
        };
        
        console.log = function(...args) {
            originalConsole.log(...args);
            addLog('log', ...args);
        };
        
        console.error = function(...args) {
            originalConsole.error(...args);
            addLog('error', ...args);
        };
        
        console.warn = function(...args) {
            originalConsole.warn(...args);
            addLog('warn', ...args);
        };
        
        // Capture errors
        window.addEventListener('error', (e) => {
            addLog('error', `${e.message} at ${e.filename}:${e.lineno}:${e.colno}`);
        });
        
        window.addEventListener('unhandledrejection', (e) => {
            addLog('error', 'Unhandled Promise Rejection:', e.reason);
        });
        
        // Try to capture iframe errors
        const iframe = document.getElementById('app');
        iframe.onload = function() {
            try {
                const iframeWindow = iframe.contentWindow;
                if (iframeWindow) {
                    // Try to access iframe console
                    iframeWindow.console.log = function(...args) {
                        addLog('log', '[IFRAME]', ...args);
                    };
                    iframeWindow.console.error = function(...args) {
                        addLog('error', '[IFRAME]', ...args);
                    };
                }
            } catch(e) {
                addLog('warn', 'Cannot access iframe console (cross-origin)');
            }
        };
        
        addLog('log', 'Debug console initialized');
        addLog('log', 'Loading app...');
    </script>
</body>
</html>
