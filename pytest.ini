[tool:pytest]
# Pytest configuration for comprehensive testing

# Test discovery
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for test categorization
markers =
    unit: Unit tests for individual modules
    integration: Integration tests for component interaction
    performance: Performance and scalability tests
    error_handling: Error handling and recovery tests
    slow: Tests that take a long time to run
    api: Tests that require external API access
    offline: Tests that work without internet connection

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --maxfail=10
    --durations=10
    --color=yes

# Coverage configuration
[coverage:run]
source = .
omit = 
    */venv/*
    */test_*
    */tests/*
    */__pycache__/*
    */temp/*
    */logs/*
    setup.py
    conftest.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

show_missing = True
precision = 2

[coverage:html]
directory = htmlcov