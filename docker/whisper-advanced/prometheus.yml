# Prometheus configuration for Whisper Advanced Integration
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "whisper_advanced_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # Whisper Advanced Integration Service
  - job_name: 'whisper-advanced'
    static_configs:
      - targets: ['whisper-advanced:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
    honor_labels: true
    params:
      format: ['prometheus']

  # System metrics from node exporter (if available)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s

  # PostgreSQL metrics (if pg_exporter is available)
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 15s

  # Redis metrics (if redis_exporter is available)
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 15s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Health check endpoints
  - job_name: 'whisper-health'
    static_configs:
      - targets: ['whisper-advanced:8000']
    metrics_path: '/health'
    scrape_interval: 30s
    scrape_timeout: 10s