name: Lighthouse CI

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL to test with Lighthouse'
        required: false
        default: 'http://localhost:3000'
        type: string

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: |
          npm ci
          cd frontend && npm ci
          cd ../desktop_app && npm ci
          cd ..
          
      - name: Build applications
        run: |
          cd frontend && npm run build
          cd ../desktop_app && npm run build
          cd ..
          
      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.12.x
        
      - name: Run Lighthouse CI
        run: lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          
      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci
          
      - name: Comment PR with results
        uses: actions/github-script@v6
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(
              fs.readFileSync('.lighthouseci/manifest.json', 'utf8')
            );
            
            let comment = '## 🚦 Lighthouse CI Results\n\n';
            
            for (const run of results) {
              const { url, summary } = run;
              comment += `### ${url}\n`;
              comment += `- Performance: ${summary.performance * 100}%\n`;
              comment += `- Accessibility: ${summary.accessibility * 100}%\n`;
              comment += `- Best Practices: ${summary['best-practices'] * 100}%\n`;
              comment += `- SEO: ${summary.seo * 100}%\n\n`;
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });